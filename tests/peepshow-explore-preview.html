<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore invitation visual review</title>
<style>body{font:14px system-ui;background:#d8dcd9;margin:16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{padding:8px 12px}iframe{display:block;border:0;background:#080b09}#status{margin:12px 0}</style>
<h1>Explore invitation visual review</h1><nav><button data-size="320,568">Small phone</button><button data-size="390,844">Phone</button><button data-size="844,390">Landscape</button><button data-size="1440,900">Desktop</button></nav><p id="status" role="status">Loading</p><iframe id="fixture" title="PeepShow responsive preview"></iframe>
<script>
const frame=document.querySelector('#fixture'),status=document.querySelector('#status');
function show(width,height){frame.width=width;frame.height=height;status.textContent=`${width} × ${height}`;frame.src='../peepshow/?explore-preview='+Date.now();}
frame.addEventListener('load',()=>{const w=frame.contentWindow;requestAnimationFrame(()=>requestAnimationFrame(()=>w.document.querySelector('#exploreInside').scrollIntoView({block:'center'})));});
document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>show(...button.dataset.size.split(',').map(Number))));
show(390,844);
</script></html>
