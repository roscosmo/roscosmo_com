<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roscosmo Studio</title>
    <meta
      name="description"
      content="Roscosmo Studio."
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #000;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      main {
        display: grid;
        place-items: center;
      }

      img {
        display: block;
        width: min(680px, 88vw);
        height: auto;
        image-rendering: pixelated;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="sr-only">Roscosmo Studio</h1>
      <img
        src="assets/images/roscosmor&amp;d_logo_bitlvel.png"
        alt="Roscosmo R and D logo"
        width="116"
        height="58"
      />
    </main>
  </body>
</html>
